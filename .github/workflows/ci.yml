name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only torch first, so requirements.txt doesn't pull the ~2 GB
      # CUDA wheel. No checkpoints, splits or ESM2 weights are downloaded:
      # tests that need them skip (see tests/test_splits.py).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82,W605 .

      - name: Run tests
        run: python -m pytest -v

      # With no trained checkpoints the demo starts in a degraded
      # "no models loaded" mode; this checks it still imports cleanly.
      - name: Import app without checkpoints
        run: python -c "import app; print(app.title_suffix())"
