[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    slow: marks tests as slow (skipped by default; opt in via -m slow)
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pkg_resources.*
